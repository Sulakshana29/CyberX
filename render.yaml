services:
  - type: web
    name: cyberx
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --workers 2 --bind 0.0.0.0:$PORT --timeout 120 app:app"
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: CYBERX_API_KEY
        generateValue: true     # Render auto-generates a secret
      - key: CYBERX_DB_PATH
        value: "/opt/render/project/src/cyberx.db"

    healthCheckPath: /health
